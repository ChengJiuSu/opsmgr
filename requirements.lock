# 生产依赖锁文件 —— 手改无效，改 requirements.txt 后用 `make lock` 重新生成。
#
# 为什么要有它：requirements.txt 里全是下界约束（>=），同一个 git commit
# 隔一周部署能解算出不同的 Django / ansible-core / redis 版本。CD 必须按本文件
# 安装，才能做到「同一制品在任何时间、任何机器上装出同一套依赖」。
#
# 不带 --generate-hashes：mysqlclient 的 wheel 是我们自己在构建容器里从 sdist
# 编出来的，其 hash 与 PyPI 上任何文件都不相等，带 hash 会让离线安装直接失败。
# 完整性由 Jenkins 制品的 md5 清单保证。
#
# 生成环境必须是 linux + CPython 3.14（与生产一致），否则会解出错平台的轮子。

