[defaults]
force_color = True
# 平台以本目录为 cwd 调用 ansible-playbook，此配置自动生效
inventory = inventories/dev/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# 平台按行读取输出，禁用 cowsay 之类的干扰
nocows = True
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True

# 可选：自定义各类结果的颜色。
# 注意必须放在文件末尾——[colors] 之后的所有键都归这个段，
# 夹在 [defaults] 中间会让 inventory/roles_path 等被静默忽略。
[colors]
ok = green
changed = yellow
error = bright red
