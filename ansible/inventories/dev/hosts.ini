# 剧本任务的主机由本 Ansible 项目自己维护（与命令任务的动态 inventory 无关）。
# 分组名建议与平台服务类型 code 保持一致，便于用 --limit 按服务圈选主机。

[local]
localhost ansible_connection=local

# 示例：按服务类型分组，替换为真实主机后使用
# [game-server]
# game-01 ansible_host=10.0.0.8 ansible_user=root
# game-02 ansible_host=10.0.0.9 ansible_user=root

# [redis]
# redis-01 ansible_host=10.0.0.20 ansible_user=root
