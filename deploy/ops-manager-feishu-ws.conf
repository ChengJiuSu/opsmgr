; 飞书长连接事件接收（supervisor）
;
; 仅在「系统管理 → 飞书接入」把事件接收方式设为**长连接**时才需要它。
; 回调模式下不要启动——两种模式同时开着会让同一个事件被处理两次（执行跑两遍）。
;
; 装到 /etc/supervisor/conf.d/ 后：
;   supervisorctl reread && supervisorctl update && supervisorctl start ops-manager-feishu-ws
;
; 前置：TASK_EXEC_BACKEND=celery。sync 后端会把 ansible 跑在事件循环里，
; 整条长连接卡死；命令启动时会直接拒绝。

[program:ops-manager-feishu-ws]
command=/home/ubuntu/apps/devops-manager-01/venv/bin/python manage.py feishu_ws
directory=/home/ubuntu/apps/devops-manager-01
user=ubuntu
environment=DJANGO_SETTINGS_MODULE="ops_manager.settings.prod"

autostart=true
autorestart=true
; 断线重连由 SDK 自己做；这里兜的是进程级异常退出
startsecs=10
startretries=999

stopasgroup=true
killasgroup=true
stopsignal=INT
stopwaitsecs=15

stdout_logfile=/home/ubuntu/apps/devops-manager-01/logs/feishu-ws.log
stderr_logfile=/home/ubuntu/apps/devops-manager-01/logs/feishu-ws.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
