; 飞书长连接事件接收（supervisor）
;
; 仅在「系统管理 → 飞书接入」把事件接收方式设为**长连接**时才需要它。
; 回调模式下不要启动——两种模式同时开着会让同一个事件被处理两次（执行跑两遍）。
;
; 装到 /etc/supervisor/conf.d/ 后：
;   supervisorctl reread && supervisorctl update && supervisorctl start ops-manager-feishu-ws
;
; 前置：TASK_EXEC_BACKEND=celery。sync 后端会把 ansible 跑在事件循环里，
; 整条长连接卡死；命令启动时会直接拒绝。

[program:ops-manager-feishu-ws]
command=/home/homelab/apps/devops-manager/venv/bin/python manage.py feishu_ws
directory=/home/homelab/apps/devops-manager
user=homelab
; LOG_SERVICE：结构化日志的 service 字段 + 落盘文件名后缀
; （logs/ops_manager-feishu-ws.log），各进程必须互不相同，否则多个进程写同一文件、轮转互相覆盖
environment=DJANGO_SETTINGS_MODULE="ops_manager.settings.prod",LOG_SERVICE="feishu-ws"
autostart=true
autorestart=true
; 断线重连由 SDK 自己做；这里兜的是进程级异常退出。
; 「飞书没配」「当前是回调模式」不会让进程退出——命令会原地等配置改好再连
; （见 apps/im_mgr/management/commands/feishu_ws.py），所以这里的重启计数
; 只会被真正的崩溃消耗，不会被一条未配置的配置烧光。
startsecs=10
startretries=999

stopasgroup=true
killasgroup=true
stopsignal=INT
stopwaitsecs=15

stdout_logfile=/home/homelab/apps/devops-manager/logs/feishu-ws.log
stderr_logfile=/home/homelab/apps/devops-manager/logs/feishu-ws.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
