# OpsManager nginx 站点配置
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/ops-manager.conf
#   sudo nginx -t && sudo systemctl reload nginx
# 按实际环境修改 server_name 与部署路径。
# 日志目录默认 /var/log/nginx/，由 logrotate 的 nginx 默认规则自动轮转。

# 自定义日志格式：在通用格式基础上追加请求耗时与上游耗时，
# 便于排查 /api 长请求（任务执行 / Jenkins 日志同步）的性能问题。
# conf.d/*.conf 被包含在 http 块内，log_format 可直接定义在此处。

server {
    listen 80;
    server_name _;
    client_max_body_size 500m;  # CI 制品压缩包上报走 /api，放宽上传限制

    # 站点级日志：access 使用带耗时的自定义格式，error 级别为 warn
    access_log /var/log/nginx/ops-manager.access.log;
    error_log  /var/log/nginx/ops-manager.error.log warn;

    # 前端静态资源（vite 构建产物）
    location / {
        root /home/ubuntu/apps/devops-manager-01/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API / Django admin
    location ~ ^/(api|admin)/ {
        # 后端请求单独记录一份，便于按接口维度分析耗时与错误
        access_log /var/log/nginx/ops-manager.api.access.log;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 任务执行 / Jenkins 日志同步为长请求
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ops-agent WebSocket 接入：daphne（ASGI）监听 8001，仅承载 /ws/；
    # HTTP API 仍走上面的 WSGI（8000），互不影响。
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 长连接：读超时需大于 agent 心跳间隔（30s），给足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django collectstatic 产物（admin / swagger 等）
    location /static/ {
        alias /home/ubuntu/apps/devops-manager-01/staticfiles/;
        access_log off;  # 静态资源不记访问日志，减少噪音
    }

    # 制品下载走 /api 签名接口，media 仅兜底（如后续有公开静态资源）
    location /media/ {
        alias /home/ubuntu/apps/devops-manager-01/media/;
        access_log off;  # 兜底路径同样关闭访问日志
    }
}