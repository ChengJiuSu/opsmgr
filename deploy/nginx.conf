# OpsManager nginx 站点配置
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/ops-manager.conf
#   sudo nginx -t && sudo systemctl reload nginx
# 按实际环境修改 server_name 与部署路径。
# 日志目录默认 /var/log/nginx/，由 logrotate 的 nginx 默认规则自动轮转。

# 自定义日志格式：在通用格式基础上追加请求耗时与上游耗时，
# 便于排查 /api 长请求（任务执行 / Jenkins 日志同步）的性能问题。
# conf.d/*.conf 被包含在 http 块内，log_format 可直接定义在此处。
#
# rt（$request_time）= nginx 收到请求首字节到响应完成的总时长；
# urt（$upstream_response_time）= gunicorn 侧耗时。
# 两者之差就是【排队时间】——worker 忙不过来 / 被换页拖住时，rt 涨而 urt 不涨，
# 这是区分「后端单接口慢」与「后端没有空闲 worker」的唯一直接证据。
log_format timing '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;
    client_max_body_size 500m;  # CI 制品压缩包上报走 /api，放宽上传限制

    # 站点级日志：access 使用带耗时的自定义格式，error 级别为 warn
    access_log /var/log/nginx/ops-manager.access.log timing;
    error_log  /var/log/nginx/ops-manager.error.log warn;

    # 前端静态资源（vite 构建产物）
    location / {
        root /home/homelab/apps/devops-manager/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API / Django admin
    location ~ ^/(api|admin)/ {
        # 后端请求单独记录一份，便于按接口维度分析耗时与错误
        access_log /var/log/nginx/ops-manager.api.access.log timing;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 必须是 $proxy_add_x_forwarded_for（追加，不是覆盖）：API 凭证的 IP 白名单
        # 从这条链的右端往左剥可信代理取真实客户端，覆盖写会把伪造值当成唯一来源。
        # 同时后端 TRUSTED_PROXIES 必须包含本机（默认 127.0.0.1）与前面每一层
        # SLB/WAF 的地址，否则白名单全部失配（见 docs/backend/configuration.md）。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 任务执行 / Jenkins 日志同步为长请求
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 机读接口的网络层粗粒度兜底（可选，与后台 per-key IP 白名单叠加）。
    #
    # 分工：per-key 白名单管「哪把 key 能从哪来」，防火墙/nginx 管「这些路径
    # 根本不该从公网被摸到」。前者拦不住扫描流量（校验发生在应用层），后者做不到
    # 按 key 区分（同一台机器上多把 key 长得一样）——两层不可互相替代。
    #
    # 只放行内网与已知出口的场景，取消注释并按实际网段调整；对接公网 Webhook
    # （GitHub/云厂商，源 IP 段大且会变）时不要在这里限制，交给 per-key 白名单。
    # location ~ ^/api/(exec/tasks/[0-9]+/trigger|artifacts/report)/ {
    #     allow 10.0.0.0/8;        # 内网
    #     allow 203.0.113.9;       # CI 出口
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 600s;
    # }

    # ops-agent WebSocket 接入：daphne（ASGI）监听 8001，仅承载 /ws/；
    # HTTP API 仍走上面的 WSGI（8000），互不影响。
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 长连接：读超时需大于 agent 心跳间隔（30s），给足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django collectstatic 产物（admin / swagger 等）
    location /static/ {
        alias /home/homelab/apps/devops-manager/staticfiles/;
        access_log off;  # 静态资源不记访问日志，减少噪音
    }

    # 制品文件内部重定向：只能由后端 X-Accel-Redirect 命中（internal），
    # 外部直接访问 /_artifacts/... 返回 404。后端 settings 里的
    # ARTIFACT_XACCEL_PREFIX 必须与这里的前缀一致（默认 /_artifacts/）。
    # 鉴权仍在 Django 的 /api/artifacts/<id>/download/ 做，这里只负责发文件，
    # 几十 MB 的包由 nginx sendfile 直发，不再占着 gunicorn worker。
    location /_artifacts/ {
        internal;
        alias /home/homelab/apps/devops-manager/media/artifacts/;  # = ARTIFACT_ROOT
        access_log off;
    }

    # 制品下载走 /api 签名接口，media 仅兜底（如后续有公开静态资源）
    location /media/ {
        alias /home/homelab/apps/devops-manager/media/;
        access_log off;  # 兜底路径同样关闭访问日志
    }
}