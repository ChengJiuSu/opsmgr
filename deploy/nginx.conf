# OpsManager nginx 站点配置
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/ops-manager.conf
#   sudo nginx -t && sudo systemctl reload nginx
# 按实际环境修改 server_name 与部署路径。
server {
    listen 80;
    server_name 192.168.1.100;

    client_max_body_size 500m;  # CI 制品压缩包上报走 /api，放宽上传限制

    # 前端静态资源（vite 构建产物）
    location / {
        root /opt/devops-manager/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API / Django admin
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 任务执行 / Jenkins 日志同步为长请求
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Django collectstatic 产物（admin / swagger 等）
    location /static/ {
        alias /opt/devops-manager/staticfiles/;
    }

    # 制品下载走 /api 签名接口，media 仅兜底（如后续有公开静态资源）
    location /media/ {
        alias /opt/devops-manager/media/;
    }
}
