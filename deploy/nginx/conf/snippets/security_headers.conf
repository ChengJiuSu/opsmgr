# =============================================================================
# 安全响应头片段
# -----------------------------------------------------------------------------
# 为什么单独抽成 snippet：
#   nginx 的 add_header 遵循「就近替换」而非「叠加」——只要某个 location 里
#   声明了任意一条 add_header，父级 server 块的全部 add_header 都会被丢弃。
#   因此凡是自身带 add_header 的 location（如设置 Cache-Control 的静态资源），
#   都必须显式 include 本文件，否则安全头会静默丢失。
#
# 挂载：./conf/snippets -> /etc/nginx/snippets（只读）
# 引用：include /etc/nginx/snippets/security_headers.conf;
# =============================================================================

# 禁止浏览器 MIME 类型嗅探
add_header X-Content-Type-Options "nosniff" always;

# 禁止被跨站 iframe 嵌套，防点击劫持
add_header X-Frame-Options "SAMEORIGIN" always;

# 跨站跳转时不泄露完整 URL
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS：确认全站 HTTPS 稳定后再启用。
# 内网自签证书场景不建议开启——浏览器会记住强制 HTTPS，回退调试会很痛苦。
# add_header Strict-Transport-Security "max-age=31536000" always;
