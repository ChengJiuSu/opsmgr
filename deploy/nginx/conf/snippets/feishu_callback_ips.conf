# =============================================================================
# 飞书回调入口的来源 IP 白名单（网络层）
# -----------------------------------------------------------------------------
# 被 ops_manager.conf.template 里的 /api/feishu/callback/… location include，
# 后面紧跟 `deny all;`，所以**本文件为空 = 拒绝所有回调**。
#
# ⚠ TODO：填入飞书开放平台公布的回调出口 IP 段后再启用飞书接入。
#    来源：飞书帮助中心「配置企业内网防火墙域名和 IP 白名单」
#    填完执行 `docker compose exec nginx nginx -s reload`（或重启容器）。
#
# 分工（两层，不可互相替代）：
#   - 本文件（nginx）—— 「这条路径根本不该从别处被摸到」，扫描流量在网络层
#     就被挡掉，后端不做任何密码学运算；
#   - 后台配置页的 ip_whitelist（DB）—— 应用层用 auth_client_ip 再校一次，
#     飞书调整 IP 段时改一处配置即可，不用改 nginx 再 reload。
#
# 调试期临时放开（**不要留在生产**）：把下面一行取消注释即可，
# 应用层白名单与签名校验仍然生效。
# allow all;
# =============================================================================

# allow 203.0.113.0/24;   # 示例：飞书回调出口段（替换为真实段）
