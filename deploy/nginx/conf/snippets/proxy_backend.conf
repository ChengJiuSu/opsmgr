# =============================================================================
# 反代到后端 Gunicorn 的公共配置
# -----------------------------------------------------------------------------
# 被 templates/ops_manager.conf.template 里多个 location include。
#
# ⚠ snippets 目录是直接挂载的，**不经过 envsubst**，所以这里不能出现
#   ${OPS_*} 变量。带变量的指令（proxy_pass / proxy_read_timeout）
#   必须留在模板的 location 里写。
# =============================================================================

proxy_http_version 1.1;
# 置空 Connection 才能命中 upstream 的 keepalive 池，否则每个请求都新建 TCP
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# 关键：Django 侧需配置 SECURE_PROXY_SSL_HEADER 才会识别为 HTTPS 请求
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_connect_timeout 10s;

# ---- 响应缓冲 ---------------------------------------------------------------
# 开启缓冲：nginx 一次性把上游响应读进内存，再按客户端节奏慢慢发。
# 关掉的代价是 nginx 只能按上游给的分片逐块写客户端，每块都吃一个 RTT，
# 慢客户端还会一直占着 gunicorn 线程 —— 这是 10KB 的 JSON 也能拖到几百毫秒
# 的直接原因。本项目实时日志走 WebSocket（daphne/8001），HTTP 侧没有
# StreamingHttpResponse，不需要为流式让路。
proxy_buffering on;
proxy_buffer_size       8k;    # 存响应头，够放大 Cookie / JWT
proxy_buffers        16 8k;    # 128KB，覆盖绝大多数列表接口的 JSON
proxy_busy_buffers_size 16k;
