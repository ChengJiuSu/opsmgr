; OpsManager Celery worker supervisor 配置（TASK_EXEC_BACKEND=celery 时必须部署）
; 安装：
;   sudo cp deploy/opsmgr-celery.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
; 日常重启：sudo supervisorctl restart opsmgr-celery
; 部署路径非 /home/homelab/apps/devops-manager 时同步修改下方各处路径与 user。
;
; 为什么必须部署：web 进程只置状态（issuing / deploying）+ 把任务丢进 Redis，
; 消费全靠这个 worker。worker 不在，任务就在队列里排队，页面上是一条永远
; 「申请中」的证书，且没有任何报错。确认手法：
;   celery -A ops_manager inspect ping   → No nodes replied
;   redis-cli -n 0 llen celery           → 不为 0
[program:opsmgr-celery]
directory=/home/homelab/apps/devops-manager/
; --concurrency=2：签发/分发都是长任务（acme.sh DNS 验证上限 ACME_TIMEOUT=900s），
; 不需要高并发；同主机的分发已在任务内串行，调大只会抢同一批目标机。
; 注意 supervisor 的续行是缩进而非反斜杠，写 `\` 会被当字面参数传给 celery。
command=/home/homelab/apps/devops-manager/venv/bin/celery -A ops_manager worker
    -l info
    --concurrency=2
; venv/bin 供 ansible；~/.acme.sh 供证书签发。
; HOME 必须显式给：supervisord 以 root 启动时不会因 user= 改写 HOME，
; 而 ACME_BIN 默认按 ~/.acme.sh/acme.sh 解析，缺了它 worker 找不到 acme.sh。
; LOG_SERVICE：结构化日志的 service 字段 + 落盘文件名后缀
; （logs/ops_manager-celery.log），各进程必须互不相同，否则多个进程写同一文件、轮转互相覆盖
environment=PATH="/home/homelab/apps/devops-manager/venv/bin:/home/homelab/.acme.sh:/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="ops_manager.settings.prod",HOME="/home/homelab",LOG_SERVICE="celery"
user=homelab
autostart=true
autorestart=true
startsecs=10
; 默认 stopwaitsecs=10 会把正在跑的 acme.sh 砍在中途——任务凭空消失、状态留在
; issuing（celery 默认取出即 ack，不会重投）。按签发上限给足收尾时间。
stopwaitsecs=930
stopsignal=TERM
; acme.sh / ansible 都是子进程，信号发整个进程组，否则重启后留孤儿进程
stopasgroup=true
killasgroup=true
stdout_logfile=/home/homelab/logs/ops-manager-celery.log
stderr_logfile=/home/homelab/logs/ops-manager-celery-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
