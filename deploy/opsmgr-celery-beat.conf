; OpsManager Celery beat supervisor 配置（定时调度：临期证书自动续签 + 收残留状态）
; 安装：
;   sudo cp deploy/opsmgr-celery-beat.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; 只调度不干活，必须与 opsmgr-celery（worker）成对部署，且**只起一个实例**
; ——多个 beat 会把同一个任务重复投递。
; 不部署的后果：自动续签不生效（手动点续签不受影响）、超时残留状态不会被自动收成
; failed（页面仍会在 30 分钟后放开重新申请与删除）。
[program:opsmgr-celery-beat]
directory=/home/homelab/apps/devops-manager/
; --schedule 落在项目 logs 下：默认写当前目录，root 启动时可能无权写
command=/home/homelab/apps/devops-manager/venv/bin/celery -A ops_manager beat
    -l info
    --schedule=/home/homelab/apps/devops-manager/logs/celerybeat-schedule
; LOG_SERVICE：结构化日志的 service 字段 + 落盘文件名后缀
; （logs/ops_manager-celery-beat.log），各进程必须互不相同，否则多个进程写同一文件、轮转互相覆盖
environment=PATH="/home/homelab/apps/devops-manager/venv/bin:/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="ops_manager.settings.prod",HOME="/home/homelab",LOG_SERVICE="celery-beat"
user=homelab
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/homelab/logs/ops-manager-celery-beat.log
stderr_logfile=/home/homelab/logs/ops-manager-celery-beat-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
