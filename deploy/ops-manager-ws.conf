; OpsManager WebSocket 服务（daphne，承载 /ws/）supervisor 配置
; 安装：
;   cp deploy/ops-manager-ws.conf ~/apps/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
;
; 不是可选项：本服务同时承载「执行日志的 WebSocket 实时推送」与 ops-agent 接入。
; 不部署它，/ws/ 是 502，前端会退回每秒一次的日志轮询接口——恰好在任务执行期间
; 给后端加压，正是要避免的方向。
; 依赖 Redis（channel layer：runner 在 celery worker 里推，消费者在本进程）。
[program:ops-manager-ws]
directory=/home/homelab/apps/devops-manager/
command=/home/homelab/apps/devops-manager/venv/bin/daphne -b 127.0.0.1 -p 8001 ops_manager.asgi:application
; venv/bin 置于 PATH 头部：未 activate venv 时也能找到 daphne 及其依赖
; LOG_SERVICE：结构化日志的 service 字段 + 落盘文件名后缀
; （logs/ops_manager-ws.log），各进程必须互不相同，否则多个进程写同一文件、轮转互相覆盖
environment=PATH="/home/homelab/apps/devops-manager/venv/bin:/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="ops_manager.settings.prod",LOG_SERVICE="ws"
; supervisord 以 root 运行时必须显式降权，否则 daphne 会以 root 跑：
user=homelab
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/home/homelab/logs/ops-manager-ws.log
stderr_logfile=/home/homelab/logs/ops-manager-ws-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
