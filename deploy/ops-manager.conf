; OpsManager Django 后端 supervisor 配置
; 安装：
;   sudo cp deploy/ops-manager.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
; 日常重启：sudo supervisorctl restart ops-manager-01
; 部署路径非 /home/ubuntu/apps/devops-manager-01 时同步修改下方各处路径；
; 程序名改动时同步 update.sh 的 SUPERVISOR_PROGRAM。
[program:ops-manager-01]
directory=/home/ubuntu/apps/devops-manager-01/
; --timeout 600：任务执行 / Jenkins 日志同步为长请求，勿调小
command=/home/ubuntu/apps/devops-manager-01/venv/bin/gunicorn ops_manager.wsgi:application
    --bind 0.0.0.0:8000
    --workers 4
    --timeout 600
; venv/bin 置于 PATH 头部：任务执行需在 PATH 上找到 ansible/ansible-playbook
environment=PATH="/home/ubuntu/apps/devops-manager-01/venv/bin:/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="ops_manager.settings.prod"
user=ubuntu
autostart=true
autorestart=true
startsecs=10
; 停止时向整个进程组发信号，避免 gunicorn worker 残留
stopasgroup=true
killasgroup=true
stdout_logfile=/home/ubuntu/logs/ops-manager.log
stderr_logfile=/home/ubuntu/logs/ops-manager-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
