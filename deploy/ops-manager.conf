; OpsManager Django 后端 supervisor 配置
; 安装：
;   cp deploy/ops-manager.conf ~/apps/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
; 日常重启：supervisorctl restart ops-manager
; 部署路径非 /home/homelab/apps/devops-manager 时同步修改下方各处路径。
;
; ⚠ supervisor 配置的两个语法陷阱（踩过）：
;   1. 续行用【缩进】，不是反斜杠。写 `\` 会被当字面参数传给 gunicorn。
;   2. `%` 是变量展开符（只认 here/program_name/ENV_*）。access-logformat 里的
;      `%(t)s` 必须写成 `%%(t)s`，否则 supervisord 加载即报
;      "Format string ... contains names which cannot be expanded"。
[program:ops-manager]
directory=/home/homelab/apps/devops-manager/
;
; ── worker 模型：为什么是 gthread 4×8 + preload ──────────────
; 这台机 4C / 3.7G，单个 Django 进程实测 RSS ≈ 116MB（腾讯/阿里云 SDK +
; channels + celery + DRF 全都要 import）。
;   16 worker 不带 preload = 16 × 116MB ≈ 1.8G > available，直接换页；
;   preload 让 app 在 fork 前加载一次，worker 间靠 COW 共享，实测降到 ~200MB。
; 并发度不靠进程数靠线程：4 × 8 = 32，比原来 16 个 sync worker 还高。
; gthread 而非 sync 的理由：JumpServer 逐台注册（每台 2 次 HTTP × 15s 超时）、
; 云控 sync_records 这类出网接口是 I/O 阻塞，sync 下占死整个进程，线程下只占一个线程。
; ⚠ preload 的代价：不能靠 HUP 优雅重载，改代码必须整体 restart（update.sh 本来就是 restart）。
;
; --timeout 600：任务执行 / Jenkins 日志同步为长请求，勿调小。
;   注意 sync/gthread worker 处理请求期间不向 arbiter 打点，超过该值 arbiter 会杀
;   整个 worker —— TASK_EXEC_BACKEND=thread 时住在里面的 ansible 线程会一起死，
;   任务永远停在 running。这也是改用 celery 后端的理由之一。
; --max-requests：worker 长期不回收会累积内存，3.7G 的机器上加个滚动回收。
; --access-logformat 里的 pid：用来判断「是否只有某个 worker 慢」，
;   排查 worker 被 ansible/GIL 拖住时是决定性的一列。
;   格式为单行 JSON，供 Vector 采集进 VictoriaLogs（见 docs/log-collection-design.md）。
;   rid 取自 nginx 下发的 X-Request-ID，与 nginx access log、Django 应用日志同值。
;   ts_clf 是 gunicorn 唯一的时间原子（%%(t)s），Apache 格式带方括号，
;   gunicorn 不提供 ISO 输出，因此原样出、由采集端解析成 _time。
;   数值字段一律加引号：status 在早期失败时会是 "-"，裸着出会产出坏 JSON。
command=/home/homelab/apps/devops-manager/venv/bin/gunicorn ops_manager.wsgi:application
    --bind 0.0.0.0:8000
    --worker-class gthread
    --workers 4
    --threads 8
    --preload
    --timeout 600
    --max-requests 2000
    --max-requests-jitter 200
    --access-logfile /home/homelab/logs/gunicorn-access.log
    --access-logformat '{"ts_clf":"%%(t)s","service":"gunicorn","method":"%%(m)s","uri":"%%(U)s","args":"%%(q)s","status":"%%(s)s","dur_ms":"%%(M)s","pid":"%%(p)s","rid":"%%({x-request-id}i)s"}'
; venv/bin 置于 PATH 头部：TASK_EXEC_BACKEND=thread 时任务执行需在 PATH 上找到
; ansible/ansible-playbook。切 celery 后端后 ansible 只在 celery worker 里跑，
; 这里保留不影响（thread 是可回退的兜底）。
; LOG_SERVICE：结构化日志的 service 字段 + 落盘文件名后缀
; （logs/ops_manager-django.log），各进程必须互不相同，否则多个进程写同一文件、轮转互相覆盖
environment=PATH="/home/homelab/apps/devops-manager/venv/bin:/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="ops_manager.settings.prod",LOG_SERVICE="django"
; supervisord 以 root 运行时必须显式降权，否则 gunicorn 会以 root 跑：
user=homelab
autostart=true
autorestart=true
startsecs=10
; 停止时向整个进程组发信号，避免 gunicorn worker 残留成孤儿进程
stopasgroup=true
killasgroup=true
stdout_logfile=/home/homelab/logs/ops-manager.log
stderr_logfile=/home/homelab/logs/ops-manager-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
