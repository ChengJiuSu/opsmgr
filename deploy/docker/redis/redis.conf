# OpsManager 内置 Redis 7.0 配置（挂载到 /usr/local/etc/redis/redis.conf）
#
# 这不是缓存 Redis，是 celery broker + channels layer + 缓存三合一：
#   db 0  celery broker / result backend
#   db 1  channels layer（执行日志推送、ops-agent 通道）
#   db 2  Django cache
# 库划分由 .env 里的 REDIS_URL / CHANNEL_LAYER / CACHE_URL 决定。

bind 0.0.0.0
protected-mode yes
port 6379

# ── 淘汰策略：noeviction 是硬要求 ────────────────────────────
# broker 库被 LRU 淘汰 = 排队中的任务凭空消失，且没有任何报错，
# 页面上只剩一条永远「执行中」的任务。内存打满时宁可让入队报错。
maxmemory 256mb
maxmemory-policy noeviction

# ── 持久化：AOF 开 ───────────────────────────────────────────
# 容器重启/宿主重启不能丢未消费的任务。everysec 在崩溃时最多丢 1 秒。
appendonly yes
appendfsync everysec
dir /data

save 900 1
save 300 10
save 60 10000

# 日志落文件（宿主 bind mount）。⚠ 代价同 mysql：docker compose logs redis 会是空的。
logfile /var/log/redis/redis.log
loglevel notice

# channels layer 的 brpop 阻塞读是 5s（CHANNEL_LAYER_BRPOP_TIMEOUT），
# 服务端超时必须大于它，否则长连接会被服务端反复掐断。
timeout 0
tcp-keepalive 300
