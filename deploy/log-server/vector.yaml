# =============================================================================
# Vector agent 配置（每台应用机一份，靠 /etc/vector/vector.env 区分本机差异）
# -----------------------------------------------------------------------------
# 字段口径见 docs/log-collection-design.md，改这里要同步改那份文档。
#
# 拓扑：每机一个 agent 直推 VictoriaLogs，不架 aggregator。机器数是个位数，
# aggregator 的价值（收敛连接数、集中转换）在这个规模上不成立，多一层只多一个
# 故障点。
#
# ${XXX} 由 systemd 的 EnvironmentFile 注入，Vector 启动时替换。
# =============================================================================

# 检查点（每个文件读到哪一行）与磁盘 buffer 都落这里。
# ⚠ 必须是【运行 vector 的那个用户】可写：Vector 会在下面为每个 source 建一个
#   同名子目录，权限不对就是启动即报
#     Could not create subdirectory "app" inside of data dir ...: Permission denied
#   而且是每个 source 各报一条，看着像五个问题，其实是同一个。
#   手动跑 validate 要用 sudo -u vector，否则验的是你自己的权限，不是服务的。
# ⚠ 删掉这个目录 = 所有文件从头重采一遍（重复数据），别在排障时随手 rm。
data_dir: /home/homelab/apps/vector/data

# nginx error log 的时间戳不带时区（`2026/09/17 15:49:35`），
# 解析时按这个时区当本地时间处理。不设的话 VRL 按 UTC 解析，直接差 8 小时。
timezone: Asia/Shanghai

sources:

  # ---------------------------------------------------------------------------
  # 源 1：Django / celery / daphne 应用日志（已是 JSON）
  # ---------------------------------------------------------------------------
  # 只采 ops_manager-*.log，【不采 error-*.log】：后者是前者中 ERROR 级的副本，
  # 两个都采等于报错在服务端存两份。error-*.log 留给人工 tail。
  app:
    type: file
    include:
      - "${OPS_APP_DIR}/logs/ops_manager-*.log"
    # 首次启动从文件开头读。改成 end 会丢掉 Vector 装好之前积压的日志，
    # 而那批往往正是「为什么要上采集」的原因。
    read_from: beginning
    # 轮转后的 ops_manager-django.log.1 不匹配上面的 glob，天然不会重复采集

  # ---------------------------------------------------------------------------
  # 源 2：supervisor 接管的进程 stdout/stderr
  # ---------------------------------------------------------------------------
  # prod 已去掉 console handler，所以这些文件里只剩 gunicorn/celery 自身的启动与
  # 崩溃输出——低频，且正是应用 file handler 覆盖不到的部分（进程起不来时，
  # Django 的 logging 根本没机会初始化），必须采。
  proc:
    type: file
    include:
      - "${OPS_LOG_DIR}/opsmgr*.log"
    read_from: beginning
    # 纯文本，且崩溃栈是多行。按「下一行以时间戳/日志级别开头」切分不可靠
    # （gunicorn、celery、Python traceback 三种前缀各不相同），这里按空闲超时
    # 聚合：连续写入的行算一条，停顿 1s 后换条。粒度粗但不会把栈撕碎。
    multiline:
      start_pattern: '^.'
      mode: continue_through
      condition_pattern: '^(\s|Traceback|  File|\[|\S+Error)'
      timeout_ms: 1000

  # ---------------------------------------------------------------------------
  # 源 3：gunicorn access log（JSON，但时间戳是 Apache 格式）
  # ---------------------------------------------------------------------------
  gunicorn:
    type: file
    include:
      - "${OPS_LOG_DIR}/gunicorn-access.log"
    read_from: beginning

  # ---------------------------------------------------------------------------
  # 源 4：nginx access log（JSON）—— 只有入口机有
  # ---------------------------------------------------------------------------
  nginx_access:
    type: file
    include:
      - /var/log/nginx/ops-manager*.access.log
    read_from: beginning

  # ---------------------------------------------------------------------------
  # 源 5：nginx error log（纯文本，多行）
  # ---------------------------------------------------------------------------
  # nginx 的 error_log 没有 JSON 格式可配（access_log 才有 escape=json），
  # 只能在这里解析。
  nginx_error:
    type: file
    include:
      - /var/log/nginx/ops-manager*.error.log
    read_from: beginning
    # upstream 超时等错误会跟着多行上下文，按「下一条以 YYYY/MM/DD 开头」切分。
    # halt_before：遇到匹配 condition_pattern 的行就结束当前这条。
    multiline:
      start_pattern: '^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}'
      mode: halt_before
      condition_pattern: '^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}'
      timeout_ms: 1000

transforms:

  app_parsed:
    type: remap
    inputs:
      - app
    source: |
      parsed, err = parse_json(.message)
      if err != null {
        # 解析失败不丢。最可能的原因是 LOG_FORMAT 被临时切回 verbose，或某个第三方
        # 库绕过 formatter 直接写了文件。留原文 + 打标记，服务端能查出
        # 「有多少行没解析成功、来自哪台机哪个 service」，格式统一是否彻底有据可查。
        . = { "msg": .message, "service": "unknown", "parse_error": true }
      } else {
        . = object!(parsed)
      }
      .host = get_hostname!()
      .app  = "ops-manager"
      .env  = "${OPS_ENV}"

  proc_parsed:
    type: remap
    inputs:
      - proc
    source: |
      .msg = del(.message)
      .service = "supervisor"
      # 文件名里带进程名（opsmgr-celery-error.log），保留它才能区分是哪个进程。
      # 用局部变量而不是直接对 . 上的路径取值再判断：路径取值在 VRL 里是 any 类型，
      # contains/upcase 这类函数会因此变成可失败的，写起来要处处 ?? 兜底。
      logfile = to_string(.file) ?? ""
      .logfile = logfile
      .level = if contains(logfile, "-error") { "ERROR" } else { "INFO" }
      .host = get_hostname!()
      .app  = "ops-manager"
      .env  = "${OPS_ENV}"

  gunicorn_parsed:
    type: remap
    inputs:
      - gunicorn
    source: |
      parsed, err = parse_json(.message)
      if err != null {
        # gunicorn 不做值转义（没有 nginx 的 escape=json），URI/query 里真出现裸引号
        # 时这一行就是坏 JSON。原文照样入库，可用 parse_error:true 查出来有多少。
        . = { "msg": .message, "service": "gunicorn", "parse_error": true }
      } else {
        . = object!(parsed)
        # %(t)s 的形状是 [17/Sep/2026:15:49:35 +0800]，gunicorn 不提供 ISO 输出。
        # 解析成 timestamp 类型后，sink 编码 JSON 时会自动写成 RFC3339。
        ts_raw = replace(to_string(.ts_clf) ?? "", r'[\[\]]', "")
        .ts = parse_timestamp(ts_raw, "%d/%b/%Y:%H:%M:%S %z") ?? now()
        del(.ts_clf)
        method = to_string(.method) ?? ""
        uri = to_string(.uri) ?? ""
        status = to_string(.status) ?? ""
        .msg = method + " " + uri + " " + status
        rid = del(.rid)
        if rid != null { .request_id = rid }
      }
      .host = get_hostname!()
      .app  = "ops-manager"
      .env  = "${OPS_ENV}"

  nginx_access_parsed:
    type: remap
    inputs:
      - nginx_access
    source: |
      parsed, err = parse_json(.message)
      if err != null {
        . = { "msg": .message, "service": "nginx", "parse_error": true }
      } else {
        . = object!(parsed)
        method = to_string(.method) ?? ""
        uri = to_string(.uri) ?? ""
        status = to_string(.status) ?? ""
        .msg = method + " " + uri + " " + status
        rid = del(.rid)
        if rid != null { .request_id = rid }
      }
      .service = "nginx"
      .host = get_hostname!()
      .app  = "ops-manager"
      .env  = "${OPS_ENV}"

  nginx_error_parsed:
    type: remap
    inputs:
      - nginx_error
    source: |
      parsed, err = parse_regex(.message, r'(?s)^(?P<ts_raw>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<body>.*)$')
      if err != null {
        . = { "msg": .message, "parse_error": true }
      } else {
        # parse_regex 的捕获组类型是 `string or undefined`，这决定了这里只能用
        # string() 而不是 to_string()，两者差别正好卡在 VRL 的两条硬错误上：
        #   to_string(x) 收任意类型 → 对捕获组永不失败 → ?? 成了多余
        #                              → E651 unnecessary error coalescing operation
        #   string(x)    只收 string → 对 `string or undefined` 可能失败 → ?? 正当
        # 而 upcase() 要求参数确定是 string，直接喂捕获组会报
        #   E103 unhandled fallible assignment，所以先用 string() ?? 把类型钉死。
        # 时间戳不带时区，靠全局 timezone 选项按本地时间解析。
        ts_raw = string(parsed.ts_raw) ?? ""
        .ts = parse_timestamp(ts_raw, "%Y/%m/%d %H:%M:%S") ?? now()
        level = string(parsed.level) ?? "error"
        .level = upcase(level)
        .msg = string(parsed.body) ?? ""
      }
      .service = "nginx-error"
      .host = get_hostname!()
      .app  = "ops-manager"
      .env  = "${OPS_ENV}"

sinks:

  # 用 Elasticsearch bulk 端点：批量、重试、压缩都是 Vector 这个 sink 现成的，
  # /insert/jsonline 配 http sink 也能写进去但重试语义弱得多。
  vlogs:
    type: elasticsearch
    inputs:
      - app_parsed
      - proc_parsed
      - gunicorn_parsed
      - nginx_access_parsed
      - nginx_error_parsed
    endpoints:
      - "http://localhost:9428/insert/elasticsearch/"
    mode: bulk
    api_version: "v8"
    compression: gzip
    # VictoriaLogs 没有 ES 的 /_cluster/health，健康检查必关，否则 sink 起不来
    healthcheck:
      enabled: false

    # VictoriaLogs 靠这几个 URL 参数决定怎么解读送进来的 JSON
    query:
      _msg_field: msg
      _time_field: ts
      # ⚠ stream 字段只能放低基数字段。加 request_id / task_id / IP 会让每个新值建
      #   一条新 stream，几天就是百万级，写入和查询一起垮；而且【已写入的 stream
      #   结构改不了】，只能等过保留期。改这一行之前先读
      #   docs/log-collection-design.md 第 2 节。
      _stream_fields: host,app,service,env
      # Vector 自己加的元字段，对排障无用，不必入库
      ignore_fields: source_type,file

    bulk:
      index: logs

    batch:
      max_events: 1000
      timeout_secs: 5

    # 磁盘 buffer 必配。默认是内存 buffer，Vector 一重启缓冲里的日志就没了——
    # 而「服务端不可用」和「需要重启 Vector」这两件事经常同时发生。
    buffer:
      type: disk
      max_size: 536870912   # 512MB
      # block 而非 drop_newest：宁可让 Vector 卡住（表现为日志延迟，看得见），
      # 也不要静默丢日志（表现为什么都没有，看不见）。
      when_full: block
