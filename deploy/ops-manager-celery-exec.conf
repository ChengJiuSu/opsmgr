; OpsManager 任务执行专用 Celery worker（TASK_EXEC_BACKEND=celery 时必须部署）
; 安装：
;   cp deploy/ops-manager-celery-exec.conf ~/apps/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
; 日常重启：supervisorctl restart ops-manager-celery-exec
;
; ── 为什么要独立一个 worker，而不复用 ops-manager-celery ──────────
; ops-manager-celery 消费默认队列（celery），跑的是证书签发/分发：acme.sh DNS
; 验证上限 900s。任务执行（ansible）和它挤同一个队列时，一个正在签发的证书能把
; 后面排队的 ansible 任务堵住十几分钟，而页面上只是一条「执行中」且无报错的任务。
; 所以任务执行走独立队列 task_exec（见 apps/task_exec/tasks.py 的 TASK_EXEC_QUEUE）。
;
; ── 为什么必须部署 ────────────────────────────────────────────
; 切了 TASK_EXEC_BACKEND=celery 之后，web 进程只建 TaskExecutionLog + 投递 Redis，
; 消费全靠这个 worker。worker 不在，任务就在队列里排队，页面上是一条永远
; 「执行中」的任务，且没有任何报错。确认手法：
;   celery -A ops_manager inspect ping        → 应能看到 exec@<hostname>
;   redis-cli -n 0 llen task_exec             → 不为 0 说明积压没人消费
[program:ops-manager-celery-exec]
directory=/home/homelab/apps/devops-manager/
;
; ── 参数说明（按这台机 4C / 3.7G 定的）────────────────────────
; nice -n 10：ansible 和 web 抢同一 4 个核时让 web 优先。ansible 慢几秒没人察觉，
;   后台卡几秒每个人都察觉。
; --concurrency=1：一次只跑一个任务。ansible 内部已按 --forks 并行（runner.py），
;   worker 再并发只是让多个 playbook 抢同一批 CPU 和同一批目标机。
;   内存账：prefork 下是 master + 1 child ≈ 230MB（单进程实测 RSS ≈ 116MB）。
;   这台机 available 只有 2.3G，若还嫌紧可换 `--pool=solo` 省掉 child（≈116MB），
;   代价是任务进程崩溃会带走整个 worker（有 autorestart 兜底）。
; -Q task_exec：只消费任务执行队列，不碰证书队列。
; -n exec@%%h：显式 node 名。与 ops-manager-celery 同机运行，不给名字两者
;   node name 撞车，inspect/revoke 会认错对象。（%% 是 supervisor 的转义）
; ⚠ supervisor 续行用【缩进】不是反斜杠；`%` 需写成 `%%`。
command=nice -n 10 /home/homelab/apps/devops-manager/venv/bin/celery -A ops_manager worker
    -l info
    -Q task_exec
    -n exec@%%h
    --concurrency=1
; venv/bin 置于 PATH 头部：任务执行需在 PATH 上找到 ansible/ansible-playbook
; LOG_SERVICE：结构化日志的 service 字段 + 落盘文件名后缀
; （logs/ops_manager-celery-exec.log），各进程必须互不相同，否则多个进程写同一文件、轮转互相覆盖
environment=PATH="/home/homelab/apps/devops-manager/venv/bin:/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="ops_manager.settings.prod",LOG_SERVICE="celery-exec"
user=homelab
autostart=true
autorestart=true
startsecs=10
; 默认 stopwaitsecs=10 会把正在跑的 ansible 砍在中途——任务凭空消失、状态留在
; running（celery 默认取出即 ack，不会重投）。给足收尾时间。
; 600 = 模块失败后等待人工处理的默认上限（TASK_FAILURE_WAIT_TIMEOUT）。
; 代价：有任务正暂停等人处理时，restart 最长要等 600s。想让重启更快就调小，
; 但被砍掉的任务需要手工把状态从 running 改掉。
stopwaitsecs=600
stopsignal=TERM
; ansible 是子进程，信号要发整个进程组，否则重启后留一堆孤儿 ssh
stopasgroup=true
killasgroup=true
stdout_logfile=/home/homelab/logs/ops-manager-celery-exec.log
stderr_logfile=/home/homelab/logs/ops-manager-celery-exec-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
